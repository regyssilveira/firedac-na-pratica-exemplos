name: Validate public examples metadata

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest structure and evidence paths
        shell: pwsh
        run: ./scripts/validate-manifest.ps1
      - name: Validate Delphi code conventions
        shell: pwsh
        run: ./scripts/audit-code-conventions.ps1
